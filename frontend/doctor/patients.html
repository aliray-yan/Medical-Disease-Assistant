<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Patients - MedAssist Doctor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#10b981',
                        accent: '#8b5cf6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
        <div class="p-6 border-b">
            <div class="flex items-center">
                <i class="fas fa-heartbeat text-primary text-2xl mr-2"></i>
                <span class="font-bold text-xl text-gray-800">MedAssist</span>
            </div>
            <p class="text-xs text-gray-500 mt-1">Doctor Portal</p>
        </div>

        <nav class="p-4">
            <ul class="space-y-2">
                <li>
                    <a href="dashboard.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-tachometer-alt w-5 mr-3"></i>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="appointments.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-calendar-alt w-5 mr-3"></i>
                        Appointments
                    </a>
                </li>
                <li>
                    <a href="patients.html" class="flex items-center px-4 py-3 text-primary bg-blue-50 rounded-lg">
                        <i class="fas fa-users w-5 mr-3"></i>
                        My Patients
                    </a>
                </li>
            </ul>

            <div class="mt-8 pt-4 border-t">
                <a href="#" onclick="logout()" class="flex items-center px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition">
                    <i class="fas fa-sign-out-alt w-5 mr-3"></i>
                    Logout
                </a>
            </div>
        </nav>
    </aside>

    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="md:ml-64 min-h-screen">

        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="flex items-center justify-between px-6 py-4">
                <div class="flex items-center">
                    <button onclick="toggleSidebar()" class="md:hidden mr-4 text-gray-600">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-semibold text-gray-800">My Patients</h1>
                </div>
                <div class="w-10 h-10 bg-secondary rounded-full flex items-center justify-center text-white">
                    <i class="fas fa-user-md"></i>
                </div>
            </div>
        </header>

        <div class="p-6">

            <!-- Search and Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="md:col-span-2 bg-white rounded-xl shadow-sm p-4">
                    <div class="relative">
                        <input type="text" id="searchPatients" placeholder="Search patients by name or email..."
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                            oninput="filterPatients()">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-4 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Total Patients</p>
                        <p class="text-3xl font-bold text-primary" id="totalPatientsCount">-</p>
                    </div>
                    <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-users text-primary text-2xl"></i>
                    </div>
                </div>
            </div>

            <!-- Patients Grid -->
            <div id="patientsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12">
                    <i class="fas fa-spinner fa-spin text-3xl text-primary"></i>
                    <p class="text-gray-500 mt-2">Loading patients...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Patient History Modal -->
    <div id="patientModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white p-6 border-b flex items-center justify-between">
                <h3 class="text-xl font-semibold text-gray-800">Patient History</h3>
                <button onclick="closePatientModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="patientModalContent" class="p-6">
                <div class="text-center py-8">
                    <i class="fas fa-spinner fa-spin text-2xl text-primary"></i>
                    <p class="text-gray-500 mt-2">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/doctor.js"></script>
    <script>
        let allPatients = [];

        document.addEventListener('DOMContentLoaded', function () {
            checkAuth('doctor');
            fetchPatients();
        });

        async function fetchPatients() {
            try {
                const response = await fetch(`${API_URL}/api/doctor/patients`, {
                    headers: getAuthHeaders()
                });
                if (!response.ok) throw new Error('Failed');
                allPatients = await response.json();
                document.getElementById('totalPatientsCount').textContent = allPatients.length;
                renderPatients(allPatients);
            } catch (error) {
                showToast('Failed to load patients', 'error');
                document.getElementById('patientsGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        <i class="fas fa-exclamation-circle text-3xl mb-2"></i>
                        <p>Failed to load patients</p>
                    </div>`;
            }
        }

        function filterPatients() {
            const search = document.getElementById('searchPatients').value.toLowerCase();
            const filtered = allPatients.filter(p =>
                p.full_name.toLowerCase().includes(search) ||
                p.email.toLowerCase().includes(search)
            );
            renderPatients(filtered);
        }

        function renderPatients(patients) {
            const grid = document.getElementById('patientsGrid');

            if (patients.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-user-slash text-3xl text-gray-400"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-700 mb-2">No Patients Found</h3>
                        <p class="text-gray-500">No patients match your search</p>
                    </div>`;
                return;
            }

            grid.innerHTML = patients.map(patient => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-lg transition overflow-hidden">
                    <div class="p-6">
                        <!-- Patient Header -->
                        <div class="flex items-center mb-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full flex items-center justify-center text-white text-xl font-bold mr-4 flex-shrink-0">
                                ${patient.full_name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2)}
                            </div>
                            <div class="min-w-0">
                                <h3 class="font-semibold text-gray-800 truncate">${patient.full_name}</h3>
                                <p class="text-sm text-gray-500 truncate">${patient.email}</p>
                            </div>
                        </div>

                        <!-- Patient Details -->
                        <div class="space-y-2 mb-4">
                            ${patient.phone ? `
                            <div class="flex items-center text-sm text-gray-600">
                                <i class="fas fa-phone w-4 mr-2 text-gray-400"></i>
                                ${patient.phone}
                            </div>` : ''}
                            ${patient.blood_group ? `
                            <div class="flex items-center text-sm text-gray-600">
                                <i class="fas fa-tint w-4 mr-2 text-red-400"></i>
                                Blood Group: <span class="font-medium ml-1">${patient.blood_group}</span>
                            </div>` : ''}
                            ${patient.allergies ? `
                            <div class="flex items-start text-sm text-gray-600">
                                <i class="fas fa-exclamation-triangle w-4 mr-2 text-yellow-400 mt-0.5"></i>
                                <span class="truncate">Allergies: ${patient.allergies}</span>
                            </div>` : ''}
                        </div>

                        <!-- Latest Prediction -->
                        ${patient.latest_prediction ? `
                        <div class="bg-purple-50 rounded-lg p-3 mb-4">
                            <p class="text-xs text-purple-600 font-medium mb-1">Latest Diagnosis</p>
                            <p class="text-sm font-semibold text-purple-800">${patient.latest_prediction.disease}</p>
                            <p class="text-xs text-purple-600">${formatDate(patient.latest_prediction.date)}</p>
                        </div>` : `
                        <div class="bg-gray-50 rounded-lg p-3 mb-4">
                            <p class="text-xs text-gray-500">No predictions recorded</p>
                        </div>`}

                        <!-- Stats -->
                        <div class="grid grid-cols-2 gap-2 mb-4 text-center">
                            <div class="bg-blue-50 rounded-lg p-2">
                                <p class="text-lg font-bold text-primary">${patient.total_appointments}</p>
                                <p class="text-xs text-gray-500">Appointments</p>
                            </div>
                            <div class="bg-green-50 rounded-lg p-2">
                                <p class="text-sm font-semibold text-secondary">${patient.last_appointment ? formatDate(patient.last_appointment) : 'Never'}</p>
                                <p class="text-xs text-gray-500">Last Visit</p>
                            </div>
                        </div>

                        <!-- Action Button -->
                        <button onclick="openPatientModal(${patient.patient_id})"
                            class="w-full bg-primary text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition text-sm">
                            <i class="fas fa-history mr-2"></i>View Full History
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function openPatientModal(patientId) {
            document.getElementById('patientModal').classList.remove('hidden');
            document.getElementById('patientModalContent').innerHTML = `
                <div class="text-center py-8">
                    <i class="fas fa-spinner fa-spin text-2xl text-primary"></i>
                    <p class="text-gray-500 mt-2">Loading patient history...</p>
                </div>`;

            try {
                const response = await fetch(`${API_URL}/api/doctor/patient/${patientId}/history`, {
                    headers: getAuthHeaders()
                });
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();
                renderPatientModal(data);
            } catch (error) {
                document.getElementById('patientModalContent').innerHTML = `
                    <div class="text-center py-8 text-red-500">
                        <i class="fas fa-exclamation-circle text-2xl mb-2"></i>
                        <p>Failed to load patient history</p>
                    </div>`;
            }
        }

        function renderPatientModal(data) {
            const info = data.patient_info;
            document.getElementById('patientModalContent').innerHTML = `
                <!-- Patient Info -->
                <div class="flex items-center mb-6">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full flex items-center justify-center text-white text-2xl font-bold mr-4">
                        ${info.full_name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2)}
                    </div>
                    <div>
                        <h4 class="text-xl font-semibold text-gray-800">${info.full_name}</h4>
                        <p class="text-gray-500">${info.email}</p>
                        ${info.phone ? `<p class="text-gray-500 text-sm">${info.phone}</p>` : ''}
                    </div>
                </div>

                <!-- Health Info -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                    <div class="bg-gray-50 p-3 rounded-lg text-center">
                        <p class="text-xs text-gray-500 mb-1">Blood Group</p>
                        <p class="font-semibold text-gray-800">${info.blood_group || 'N/A'}</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg text-center">
                        <p class="text-xs text-gray-500 mb-1">Gender</p>
                        <p class="font-semibold text-gray-800">${info.gender || 'N/A'}</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg text-center">
                        <p class="text-xs text-gray-500 mb-1">Date of Birth</p>
                        <p class="font-semibold text-gray-800">${info.date_of_birth ? formatDate(info.date_of_birth) : 'N/A'}</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg text-center">
                        <p class="text-xs text-gray-500 mb-1">Allergies</p>
                        <p class="font-semibold text-gray-800 text-xs">${info.allergies || 'None'}</p>
                    </div>
                </div>

                ${info.emergency_contact_name ? `
                <div class="bg-red-50 border border-red-100 rounded-lg p-3 mb-6">
                    <p class="text-xs text-red-600 font-medium mb-1">
                        <i class="fas fa-phone-alt mr-1"></i>Emergency Contact
                    </p>
                    <p class="font-semibold text-red-800">${info.emergency_contact_name}</p>
                    <p class="text-sm text-red-700">${info.emergency_contact_phone || ''}</p>
                </div>` : ''}

                <!-- Predictions -->
                <div class="mb-6">
                    <h5 class="font-semibold text-gray-800 mb-3 flex items-center">
                        <i class="fas fa-brain text-purple-500 mr-2"></i>
                        Prediction History (${data.predictions.length})
                    </h5>
                    ${data.predictions.length === 0
                    ? '<p class="text-gray-500 text-sm bg-gray-50 p-3 rounded-lg">No predictions recorded</p>'
                    : `<div class="space-y-3">
                            ${data.predictions.map(pred => `
                                <div class="border rounded-lg p-3">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="font-semibold text-gray-800">${pred.disease}</span>
                                        <span class="text-xs text-gray-500">${formatDate(pred.date)}</span>
                                    </div>
                                    <div class="flex items-center mb-2">
                                        <div class="flex-1 bg-gray-200 rounded-full h-1.5 mr-2">
                                            <div class="bg-primary h-1.5 rounded-full" style="width: ${(pred.confidence * 100).toFixed(0)}%"></div>
                                        </div>
                                        <span class="text-xs text-gray-600">${(pred.confidence * 100).toFixed(1)}%</span>
                                    </div>
                                    <div class="flex flex-wrap gap-1">
                                        ${pred.symptoms.slice(0, 5).map(s =>
                        `<span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs">${formatSymptomName(s)}</span>`
                    ).join('')}
                                        ${pred.symptoms.length > 5 ? `<span class="text-xs text-gray-400">+${pred.symptoms.length - 5} more</span>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>`}
                </div>

                <!-- Appointments -->
                <div>
                    <h5 class="font-semibold text-gray-800 mb-3 flex items-center">
                        <i class="fas fa-calendar-check text-green-500 mr-2"></i>
                        Appointment History (${data.appointments.length})
                    </h5>
                    ${data.appointments.length === 0
                    ? '<p class="text-gray-500 text-sm bg-gray-50 p-3 rounded-lg">No appointments recorded</p>'
                    : `<div class="space-y-3">
                            ${data.appointments.map(apt => `
                                <div class="flex items-center justify-between border rounded-lg p-3">
                                    <div>
                                        <p class="font-medium text-gray-800">${formatDate(apt.date)}</p>
                                        <p class="text-sm text-gray-500">${formatTime(apt.time)} ${apt.reason ? '· ' + apt.reason : ''}</p>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${getStatusClass(apt.status)}">
                                        ${apt.status.charAt(0).toUpperCase() + apt.status.slice(1)}
                                    </span>
                                </div>
                            `).join('')}
                        </div>`}
                </div>
            `;
        }

        function closePatientModal() {
            document.getElementById('patientModal').classList.add('hidden');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }
    </script>
</body>
</html>
