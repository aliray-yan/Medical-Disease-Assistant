<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients Management - MedAssist Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563eb', secondary: '#10b981', accent: '#8b5cf6' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-gray-900 text-white z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
        <div class="p-6 border-b border-gray-800">
            <div class="flex items-center">
                <i class="fas fa-heartbeat text-primary text-2xl mr-2"></i>
                <span class="font-bold text-xl">MedAssist</span>
            </div>
            <p class="text-xs text-gray-400 mt-1">Admin Panel</p>
        </div>
        <nav class="p-4">
            <ul class="space-y-2">
                <li><a href="dashboard.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 rounded-lg transition"><i class="fas fa-tachometer-alt w-5 mr-3"></i>Dashboard</a></li>
                <li><a href="patients.html" class="flex items-center px-4 py-3 bg-gray-800 rounded-lg"><i class="fas fa-users w-5 mr-3"></i>Patients</a></li>
                <li><a href="doctors.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 rounded-lg transition"><i class="fas fa-user-md w-5 mr-3"></i>Doctors</a></li>
                <li><a href="predictions.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 rounded-lg transition"><i class="fas fa-brain w-5 mr-3"></i>Predictions</a></li>
                <li><a href="referrals.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 rounded-lg transition"><i class="fas fa-share-square w-5 mr-3"></i>Referrals</a></li>
            </ul>
            <div class="mt-8 pt-4 border-t border-gray-800">
                <a href="#" onclick="logout()" class="flex items-center px-4 py-3 text-red-400 hover:bg-red-900/20 rounded-lg transition">
                    <i class="fas fa-sign-out-alt w-5 mr-3"></i>Logout
                </a>
            </div>
        </nav>
    </aside>

    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden" onclick="toggleSidebar()"></div>

    <main class="md:ml-64 min-h-screen">
        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="flex items-center justify-between px-6 py-4">
                <div class="flex items-center">
                    <button onclick="toggleSidebar()" class="md:hidden mr-4 text-gray-600"><i class="fas fa-bars text-xl"></i></button>
                    <h1 class="text-xl font-semibold text-gray-800">Patients Management</h1>
                </div>
                <div class="text-sm text-gray-500">
                    Total: <span class="font-semibold text-gray-800" id="patientCountHeader">-</span> patients
                </div>
            </div>
        </header>

        <div class="p-6">
            <!-- Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-xl p-4 shadow-sm text-center">
                    <p class="text-2xl font-bold text-primary" id="statTotal">-</p>
                    <p class="text-sm text-gray-500">Total Patients</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm text-center">
                    <p class="text-2xl font-bold text-secondary" id="statActive">-</p>
                    <p class="text-sm text-gray-500">Active</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm text-center">
                    <p class="text-2xl font-bold text-accent" id="statWithPredictions">-</p>
                    <p class="text-sm text-gray-500">With Predictions</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm text-center">
                    <p class="text-2xl font-bold text-yellow-500" id="statWithReferrals">-</p>
                    <p class="text-sm text-gray-500">Referred</p>
                </div>
            </div>

            <!-- Filters -->
            <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="relative md:col-span-2">
                        <input type="text" id="searchPatients" placeholder="Search by name or email..."
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary"
                            oninput="filterPatients()">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                    </div>
                    <select id="statusFilterP" onchange="filterPatients()"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary">
                        <option value="">All Statuses</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                    <select id="predictionFilter" onchange="filterPatients()"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary">
                        <option value="">All Patients</option>
                        <option value="with">With Predictions</option>
                        <option value="without">No Predictions</option>
                        <option value="referred">Referred</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Patient</th>
                                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Contact</th>
                                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Registered</th>
                                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Predictions</th>
                                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Latest Disease</th>
                                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Referred</th>
                                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Status</th>
                                <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="patientsTableBody" class="divide-y divide-gray-100">
                            <tr><td colspan="8" class="text-center py-12"><i class="fas fa-spinner fa-spin text-2xl text-primary"></i></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Patient Detail Modal -->
    <div id="patientDetailModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full max-h-[85vh] overflow-y-auto">
            <div class="sticky top-0 bg-white p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-semibold text-gray-800">Patient Details</h3>
                <button onclick="closePatientDetail()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="patientDetailContent" class="p-6"></div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        let allPatients = [];

        document.addEventListener('DOMContentLoaded', function () {
            checkAuth('admin');
            fetchPatients();
        });

        async function fetchPatients() {
            try {
                const response = await fetch(`${API_URL}/api/admin/patients`, { headers: getAuthHeaders() });
                if (!response.ok) throw new Error('Failed');
                allPatients = await response.json();
                updatePatientStats();
                renderPatients(allPatients);
            } catch (error) {
                showToast('Failed to load patients', 'error');
            }
        }

        function updatePatientStats() {
            document.getElementById('statTotal').textContent = allPatients.length;
            document.getElementById('patientCountHeader').textContent = allPatients.length;
            document.getElementById('statActive').textContent = allPatients.filter(p => p.user.is_active).length;
            document.getElementById('statWithPredictions').textContent = allPatients.filter(p => p.total_predictions > 0).length;
            document.getElementById('statWithReferrals').textContent = allPatients.filter(p => p.has_referral).length;
        }

        function filterPatients() {
            const search = document.getElementById('searchPatients').value.toLowerCase();
            const status = document.getElementById('statusFilterP').value;
            const pred = document.getElementById('predictionFilter').value;

            const filtered = allPatients.filter(p => {
                const matchSearch = !search ||
                    p.user.full_name.toLowerCase().includes(search) ||
                    p.user.email.toLowerCase().includes(search);
                const matchStatus = !status ||
                    (status === 'active' && p.user.is_active) ||
                    (status === 'inactive' && !p.user.is_active);
                const matchPred = !pred ||
                    (pred === 'with' && p.total_predictions > 0) ||
                    (pred === 'without' && p.total_predictions === 0) ||
                    (pred === 'referred' && p.has_referral);
                return matchSearch && matchStatus && matchPred;
            });

            renderPatients(filtered);
        }

        function renderPatients(patients) {
            const tbody = document.getElementById('patientsTableBody');
            if (patients.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-12 text-gray-500">No patients found</td></tr>`;
                return;
            }

            tbody.innerHTML = patients.map(p => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4">
                        <div class="flex items-center">
                            <div class="w-9 h-9 bg-blue-100 rounded-full flex items-center justify-center mr-3 flex-shrink-0">
                                <span class="text-primary text-sm font-semibold">
                                    ${p.user.full_name.split(' ').map(n => n[0]).join('').substring(0, 2)}
                                </span>
                            </div>
                            <div>
                                <p class="font-medium text-gray-800 text-sm">${p.user.full_name}</p>
                                <p class="text-xs text-gray-500">${p.user.email}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600">${p.user.phone || '-'}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${formatDate(p.user.created_at)}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${p.total_predictions > 0 ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-500'}">
                            ${p.total_predictions} predictions
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        ${p.latest_prediction
                    ? `<div>
                                <p class="text-xs font-medium text-purple-700">${p.latest_prediction.disease}</p>
                                <p class="text-xs text-gray-400">${formatDate(p.latest_prediction.date)}</p>
                            </div>`
                    : '<span class="text-gray-400 text-xs">None</span>'}
                    </td>
                    <td class="px-6 py-4">
                        ${p.has_referral
                    ? '<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold"><i class="fas fa-check mr-1"></i>Yes</span>'
                    : '<span class="px-2 py-1 bg-gray-100 text-gray-500 rounded-full text-xs">No</span>'}
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-full text-xs font-semibold ${p.user.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">
                            ${p.user.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <button onclick="viewPatientDetail(${JSON.stringify(p).replace(/"/g, '&quot;')})"
                                class="p-1.5 bg-blue-50 text-primary rounded-lg hover:bg-blue-100 transition" title="View Details">
                                <i class="fas fa-eye text-sm"></i>
                            </button>
                            <button onclick="togglePatientStatus(${p.patient_id}, ${p.user.is_active})"
                                class="p-1.5 ${p.user.is_active ? 'bg-red-50 text-red-500 hover:bg-red-100' : 'bg-green-50 text-secondary hover:bg-green-100'} rounded-lg transition"
                                title="${p.user.is_active ? 'Deactivate' : 'Activate'}">
                                <i class="fas ${p.user.is_active ? 'fa-ban' : 'fa-check-circle'} text-sm"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function viewPatientDetail(patient) {
            document.getElementById('patientDetailModal').classList.remove('hidden');
            document.getElementById('patientDetailContent').innerHTML = `
                <div class="flex items-center mb-6">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mr-4">
                        <span class="text-primary text-2xl font-bold">
                            ${patient.user.full_name.split(' ').map(n => n[0]).join('').substring(0, 2)}
                        </span>
                    </div>
                    <div>
                        <h4 class="text-xl font-bold text-gray-800">${patient.user.full_name}</h4>
                        <p class="text-gray-500">${patient.user.email}</p>
                        <span class="px-2 py-0.5 rounded-full text-xs ${patient.user.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">
                            ${patient.user.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <p class="text-xs text-gray-500">Phone</p>
                        <p class="font-medium text-gray-800">${patient.user.phone || 'N/A'}</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <p class="text-xs text-gray-500">Blood Group</p>
                        <p class="font-medium text-gray-800">${patient.blood_group || 'N/A'}</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <p class="text-xs text-gray-500">Registered</p>
                        <p class="font-medium text-gray-800">${formatDate(patient.user.created_at)}</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <p class="text-xs text-gray-500">Gender</p>
                        <p class="font-medium text-gray-800">${patient.user.gender || 'N/A'}</p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="bg-blue-50 p-3 rounded-lg text-center">
                        <p class="text-2xl font-bold text-primary">${patient.total_predictions}</p>
                        <p class="text-xs text-gray-500">Predictions</p>
                    </div>
                    <div class="bg-green-50 p-3 rounded-lg text-center">
                        <p class="text-2xl font-bold text-secondary">${patient.total_appointments}</p>
                        <p class="text-xs text-gray-500">Appointments</p>
                    </div>
                    <div class="bg-purple-50 p-3 rounded-lg text-center">
                        <p class="text-2xl font-bold text-accent">${patient.has_referral ? 'Yes' : 'No'}</p>
                        <p class="text-xs text-gray-500">Referred</p>
                    </div>
                </div>

                ${patient.latest_prediction ? `
                <div class="bg-purple-50 border border-purple-100 rounded-lg p-4 mb-4">
                    <p class="text-xs text-purple-600 font-semibold mb-1">LATEST PREDICTION</p>
                    <p class="font-bold text-purple-800">${patient.latest_prediction.disease}</p>
                    <p class="text-xs text-purple-600">${formatDate(patient.latest_prediction.date)} &bull;
                        ${(patient.latest_prediction.confidence * 100).toFixed(1)}% confidence</p>
                </div>` : ''}

                ${patient.allergies ? `
                <div class="bg-yellow-50 border border-yellow-100 rounded-lg p-3">
                    <p class="text-xs text-yellow-700 font-semibold"><i class="fas fa-exclamation-triangle mr-1"></i>Allergies</p>
                    <p class="text-sm text-yellow-800 mt-1">${patient.allergies}</p>
                </div>` : ''}
            `;
        }

        function closePatientDetail() {
            document.getElementById('patientDetailModal').classList.add('hidden');
        }

        async function togglePatientStatus(patientId, currentStatus) {
            const action = currentStatus ? 'deactivate' : 'activate';
            if (!confirm(`Are you sure you want to ${action} this patient account?`)) return;

            try {
                const response = await fetch(`${API_URL}/api/admin/patients/${patientId}/status`, {
                    method: 'PUT',
                    headers: getAuthHeaders()
                });
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();
                showToast(data.message, 'success');
                fetchPatients();
            } catch (error) {
                showToast('Failed to update patient status', 'error');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }
    </script>
</body>
</html>
