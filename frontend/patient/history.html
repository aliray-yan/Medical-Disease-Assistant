<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical History - MedAssist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#10b981',
                        accent: '#8b5cf6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-40 transform -translate-x-full md:translate-x-0 transition-transform">
        <div class="p-6 border-b">
            <div class="flex items-center">
                <i class="fas fa-heartbeat text-primary text-2xl mr-2"></i>
                <span class="font-bold text-xl text-gray-800">MedAssist</span>
            </div>
        </div>
        
        <nav class="p-4">
            <ul class="space-y-2">
                <li>
                    <a href="dashboard.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-home w-5 mr-3"></i>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="symptom-checker.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-stethoscope w-5 mr-3"></i>
                        Symptom Checker
                    </a>
                </li>
                <li>
                    <a href="history.html" class="flex items-center px-4 py-3 text-primary bg-blue-50 rounded-lg">
                        <i class="fas fa-history w-5 mr-3"></i>
                        Medical History
                    </a>
                </li>
                <li>
                    <a href="doctors.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-user-md w-5 mr-3"></i>
                        Find Doctors
                    </a>
                </li>
                <li>
                    <a href="book-appointment.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-calendar-plus w-5 mr-3"></i>
                        Book Appointment
                    </a>
                </li>
            </ul>
            
            <div class="mt-8 pt-4 border-t">
                <a href="#" onclick="logout()" class="flex items-center px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition">
                    <i class="fas fa-sign-out-alt w-5 mr-3"></i>
                    Logout
                </a>
            </div>
        </nav>
    </aside>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="md:ml-64 min-h-screen">
        <!-- Top Header -->
        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="flex items-center justify-between px-6 py-4">
                <div class="flex items-center">
                    <button onclick="toggleSidebar()" class="md:hidden mr-4 text-gray-600">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-semibold text-gray-800">Medical History</h1>
                </div>
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-semibold" id="userAvatar">
                        P
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <div class="p-6">
            <!-- Tabs -->
            <div class="bg-white rounded-xl shadow-sm mb-6">
                <div class="flex border-b">
                    <button onclick="showTab('predictions')" id="tabPredictions" class="flex-1 py-4 px-6 text-center font-medium border-b-2 border-primary text-primary">
                        <i class="fas fa-clipboard-list mr-2"></i>Predictions
                    </button>
                    <button onclick="showTab('appointments')" id="tabAppointments" class="flex-1 py-4 px-6 text-center font-medium text-gray-500 hover:text-gray-700">
                        <i class="fas fa-calendar-check mr-2"></i>Appointments
                    </button>
                </div>
            </div>

            <!-- Predictions Tab Content -->
            <div id="predictionsContent">
                <div class="bg-white rounded-xl shadow-sm">
                    <div class="p-6 border-b">
                        <h2 class="text-lg font-semibold text-gray-800">Prediction History</h2>
                        <p class="text-sm text-gray-500 mt-1">All your past symptom checks and diagnoses</p>
                    </div>
                    <div class="p-6" id="predictionsContainer">
                        <!-- Loading state -->
                        <div class="text-center py-8">
                            <i class="fas fa-spinner fa-spin text-2xl text-primary"></i>
                            <p class="text-gray-500 mt-2">Loading history...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Appointments Tab Content -->
            <div id="appointmentsContent" class="hidden">
                <div class="bg-white rounded-xl shadow-sm">
                    <div class="p-6 border-b">
                        <h2 class="text-lg font-semibold text-gray-800">Appointment History</h2>
                        <p class="text-sm text-gray-500 mt-1">Your past and upcoming appointments</p>
                    </div>
                    <div class="p-6" id="appointmentsContainer">
                        <!-- Loading state -->
                        <div class="text-center py-8">
                            <i class="fas fa-spinner fa-spin text-2xl text-primary"></i>
                            <p class="text-gray-500 mt-2">Loading appointments...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/patient.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth('patient');
            loadPredictionHistory();
            loadAppointmentHistory();
        });

        function showTab(tab) {
            const tabs = ['predictions', 'appointments'];
            tabs.forEach(t => {
                document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.remove('border-primary', 'text-primary');
                document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.add('text-gray-500', 'border-transparent');
                document.getElementById(`${t}Content`).classList.add('hidden');
            });
            
            document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('border-primary', 'text-primary');
            document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('text-gray-500', 'border-transparent');
            document.getElementById(`${tab}Content`).classList.remove('hidden');
        }

        async function loadPredictionHistory() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/api/patient/history`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to load history');
                
                const predictions = await response.json();
                renderPredictions(predictions);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('predictionsContainer').innerHTML = `
                    <div class="text-center py-8 text-red-500">
                        <i class="fas fa-exclamation-circle text-2xl mb-2"></i>
                        <p>Failed to load history</p>
                    </div>
                `;
            }
        }

        function renderPredictions(predictions) {
            const container = document.getElementById('predictionsContainer');
            
            if (predictions.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-clipboard-list text-3xl text-gray-400"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-700 mb-2">No History Yet</h3>
                        <p class="text-gray-500 mb-4">Start your health journey by checking your symptoms</p>
                        <a href="symptom-checker.html" class="inline-block bg-primary text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                            Check Symptoms
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="space-y-4">
                    ${predictions.map(pred => `
                        <div class="border rounded-lg p-4 hover:shadow-md transition">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center">
                                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                                        <i class="fas fa-stethoscope text-primary"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-semibold text-gray-800">${pred.predicted_disease}</h4>
                                        <p class="text-sm text-gray-500">${formatDate(pred.prediction_date)}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="inline-block px-3 py-1 rounded-full text-sm font-medium ${getConfidenceClass(pred.confidence_score)}">
                                        ${(pred.confidence_score * 100).toFixed(1)}% confidence
                                    </span>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-2 mb-3">
                                ${pred.symptoms_selected.slice(0, 5).map(s => `
                                    <span class="px-2 py-1 bg-gray-100 text-gray-600 rounded text-sm">${formatSymptomName(s)}</span>
                                `).join('')}
                                ${pred.symptoms_selected.length > 5 ? `<span class="px-2 py-1 text-gray-500 text-sm">+${pred.symptoms_selected.length - 5} more</span>` : ''}
                            </div>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-gray-600">
                                    <i class="fas fa-user-md mr-1"></i>${pred.recommended_specialist}
                                </span>
                                <a href="doctors.html?specialty=${encodeURIComponent(pred.recommended_specialist)}" class="text-primary hover:underline">
                                    Book Appointment <i class="fas fa-arrow-right ml-1"></i>
                                </a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function loadAppointmentHistory() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/api/patient/appointments`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to load appointments');
                
                const appointments = await response.json();
                renderAppointments(appointments);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderAppointments(appointments) {
            const container = document.getElementById('appointmentsContainer');
            
            if (appointments.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-calendar text-3xl text-gray-400"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-700 mb-2">No Appointments</h3>
                        <p class="text-gray-500 mb-4">You haven't booked any appointments yet</p>
                        <a href="doctors.html" class="inline-block bg-primary text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                            Find a Doctor
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="space-y-4">
                    ${appointments.map(apt => `
                        <div class="border rounded-lg p-4 hover:shadow-md transition">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center">
                                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mr-4">
                                        <i class="fas fa-user-md text-secondary text-xl"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-semibold text-gray-800">${apt.doctor_name}</h4>
                                        <p class="text-sm text-gray-500">${apt.doctor_specialty}</p>
                                    </div>
                                </div>
                                <span class="px-3 py-1 rounded-full text-sm font-medium ${getStatusClass(apt.status)}">
                                    ${apt.status.charAt(0).toUpperCase() + apt.status.slice(1)}
                                </span>
                            </div>
                            <div class="mt-3 pl-16">
                                <div class="flex items-center text-sm text-gray-600 mb-2">
                                    <i class="fas fa-calendar mr-2"></i>
                                    ${formatDate(apt.appointment_date)} at ${apt.appointment_time}
                                </div>
                                ${apt.reason ? `
                                    <div class="flex items-center text-sm text-gray-600">
                                        <i class="fas fa-notes-medical mr-2"></i>
                                        ${apt.reason}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function getConfidenceClass(confidence) {
            if (confidence >= 0.8) return 'bg-green-100 text-green-700';
            if (confidence >= 0.5) return 'bg-yellow-100 text-yellow-700';
            return 'bg-red-100 text-red-700';
        }

        function getStatusClass(status) {
            const classes = {
                'pending': 'bg-yellow-100 text-yellow-700',
                'confirmed': 'bg-blue-100 text-blue-700',
                'completed': 'bg-green-100 text-green-700',
                'cancelled': 'bg-red-100 text-red-700'
            };
            return classes[status] || 'bg-gray-100 text-gray-700';
        }

        function formatSymptomName(symptom) {
            return symptom.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', {
                year: 'numeric', month: 'short', day: 'numeric'
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
    </script>
</body>
</html>
