<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Doctors - MedAssist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#10b981',
                        accent: '#8b5cf6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-40 transform -translate-x-full md:translate-x-0 transition-transform">
        <div class="p-6 border-b">
            <div class="flex items-center">
                <i class="fas fa-heartbeat text-primary text-2xl mr-2"></i>
                <span class="font-bold text-xl text-gray-800">MedAssist</span>
            </div>
        </div>
        
        <nav class="p-4">
            <ul class="space-y-2">
                <li>
                    <a href="dashboard.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-home w-5 mr-3"></i>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="symptom-checker.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-stethoscope w-5 mr-3"></i>
                        Symptom Checker
                    </a>
                </li>
                <li>
                    <a href="history.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-history w-5 mr-3"></i>
                        Medical History
                    </a>
                </li>
                <li>
                    <a href="doctors.html" class="flex items-center px-4 py-3 text-primary bg-blue-50 rounded-lg">
                        <i class="fas fa-user-md w-5 mr-3"></i>
                        Find Doctors
                    </a>
                </li>
                <li>
                    <a href="book-appointment.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                        <i class="fas fa-calendar-plus w-5 mr-3"></i>
                        Book Appointment
                    </a>
                </li>
            </ul>
            
            <div class="mt-8 pt-4 border-t">
                <a href="#" onclick="logout()" class="flex items-center px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition">
                    <i class="fas fa-sign-out-alt w-5 mr-3"></i>
                    Logout
                </a>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 min-h-screen">
        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="flex items-center justify-between px-6 py-4">
                <div class="flex items-center">
                    <button onclick="toggleSidebar()" class="md:hidden mr-4 text-gray-600">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-semibold text-gray-800">Find Doctors</h1>
                </div>
            </div>
        </header>

        <div class="p-6">
            <!-- Recommendation Banner (if coming from prediction) -->
            <div id="recommendationBanner" class="hidden bg-green-50 border border-green-200 rounded-xl p-4 mb-6">
                <div class="flex items-center">
                    <i class="fas fa-lightbulb text-green-500 mr-3"></i>
                    <div>
                        <p class="font-medium text-green-800">Based on your symptoms</p>
                        <p class="text-sm text-green-700">We recommend consulting a <strong id="recommendedSpecialty"></strong></p>
                    </div>
                </div>
            </div>

            <!-- Search and Filters -->
            <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="relative">
                        <input type="text" id="searchDoctor" placeholder="Search doctor name..." 
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                            oninput="filterDoctors()">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                    <select id="specialtyFilter" onchange="filterDoctors()" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">All Specialties</option>
                        <option value="General Physician">General Physician</option>
                        <option value="Cardiologist">Cardiologist</option>
                        <option value="Dermatologist">Dermatologist</option>
                        <option value="Neurologist">Neurologist</option>
                        <option value="Gastroenterologist">Gastroenterologist</option>
                        <option value="Pulmonologist">Pulmonologist</option>
                        <option value="Endocrinologist">Endocrinologist</option>
                        <option value="Orthopedic Surgeon">Orthopedic Surgeon</option>
                    </select>
                    <select id="sortBy" onchange="filterDoctors()" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="rating">Sort by Rating</option>
                        <option value="experience">Sort by Experience</option>
                        <option value="fee_low">Fee: Low to High</option>
                        <option value="fee_high">Fee: High to Low</option>
                    </select>
                </div>
            </div>

            <!-- Doctors Grid -->
            <div id="doctorsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading state -->
                <div class="col-span-full text-center py-12">
                    <i class="fas fa-spinner fa-spin text-3xl text-primary"></i>
                    <p class="text-gray-500 mt-2">Loading doctors...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Booking Modal -->
    <div id="bookingModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-semibold text-gray-800">Book Appointment</h3>
                    <button onclick="closeBookingModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
            </div>
            <div class="p-6" id="modalContent">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/patient.js"></script>
    <script>
        let allDoctors = [];
        let selectedDoctor = null;

        document.addEventListener('DOMContentLoaded', function() {
            checkAuth('patient');
            checkForRecommendation();
            loadDoctors();
        });

        function checkForRecommendation() {
            const urlParams = new URLSearchParams(window.location.search);
            const specialty = urlParams.get('specialty');
            
            if (specialty) {
                document.getElementById('recommendationBanner').classList.remove('hidden');
                document.getElementById('recommendedSpecialty').textContent = specialty;
                document.getElementById('specialtyFilter').value = specialty;
            }
        }

        async function loadDoctors() {
            try {
                const token = localStorage.getItem('token');
                const specialty = document.getElementById('specialtyFilter').value;
                
                let url = `${API_URL}/api/patient/doctors`;
                if (specialty) url += `?specialty=${encodeURIComponent(specialty)}`;
                
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to load doctors');
                
                allDoctors = await response.json();
                renderDoctors(allDoctors);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('doctorsGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        <i class="fas fa-exclamation-circle text-3xl mb-2"></i>
                        <p>Failed to load doctors</p>
                    </div>
                `;
            }
        }

        function filterDoctors() {
            const search = document.getElementById('searchDoctor').value.toLowerCase();
            const specialty = document.getElementById('specialtyFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = allDoctors.filter(doc => {
                const matchesSearch = doc.full_name.toLowerCase().includes(search);
                const matchesSpecialty = !specialty || doc.specialty.includes(specialty);
                return matchesSearch && matchesSpecialty;
            });

            // Sort
            filtered.sort((a, b) => {
                switch(sortBy) {
                    case 'rating': return b.rating - a.rating;
                    case 'experience': return b.experience_years - a.experience_years;
                    case 'fee_low': return a.consultation_fee - b.consultation_fee;
                    case 'fee_high': return b.consultation_fee - a.consultation_fee;
                    default: return 0;
                }
            });

            renderDoctors(filtered);
        }

        function renderDoctors(doctors) {
            const container = document.getElementById('doctorsGrid');
            
            if (doctors.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-user-md text-3xl text-gray-400"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-700 mb-2">No Doctors Found</h3>
                        <p class="text-gray-500">Try adjusting your search filters</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = doctors.map(doc => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-lg transition overflow-hidden">
                    <div class="p-6">
                        <div class="flex items-center mb-4">
                            <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full flex items-center justify-center text-white text-xl font-semibold mr-4">
                                ${doc.full_name.split(' ').map(n => n[0]).join('')}
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-800">${doc.full_name}</h3>
                                <p class="text-sm text-primary">${doc.specialty}</p>
                            </div>
                        </div>
                        
                        <div class="space-y-2 mb-4">
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-gray-500">Experience</span>
                                <span class="font-medium text-gray-800">${doc.experience_years} years</span>
                            </div>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-gray-500">Rating</span>
                                <span class="font-medium text-gray-800">
                                    <i class="fas fa-star text-yellow-400"></i> ${doc.rating.toFixed(1)}
                                </span>
                            </div>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-gray-500">Consultation Fee</span>
                                <span class="font-medium text-green-600">$${doc.consultation_fee}</span>
                            </div>
                        </div>
                        
                        ${doc.is_verified ? `
                            <div class="flex items-center text-sm text-green-600 mb-4">
                                <i class="fas fa-check-circle mr-1"></i>
                                Verified
                            </div>
                        ` : ''}
                        
                        <button onclick="openBookingModal(${doc.doctor_id})" 
                            class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                            Book Appointment
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openBookingModal(doctorId) {
            selectedDoctor = allDoctors.find(d => d.doctor_id === doctorId);
            if (!selectedDoctor) return;

            const modal = document.getElementById('bookingModal');
            const content = document.getElementById('modalContent');

            // Generate time slots
            const timeSlots = ['09:00', '10:00', '11:00', '14:00', '15:00', '16:00'];

            content.innerHTML = `
                <div class="flex items-center mb-6">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full flex items-center justify-center text-white text-xl font-semibold mr-4">
                        ${selectedDoctor.full_name.split(' ').map(n => n[0]).join('')}
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-800">${selectedDoctor.full_name}</h4>
                        <p class="text-sm text-primary">${selectedDoctor.specialty}</p>
                        <p class="text-sm text-green-600">$${selectedDoctor.consultation_fee}</p>
                    </div>
                </div>

                <form onsubmit="submitBooking(event)">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Select Date</label>
                            <input type="date" id="appointmentDate" required min="${getTomorrowDate()}"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Select Time</label>
                            <div class="grid grid-cols-3 gap-2">
                                ${timeSlots.map(time => `
                                    <label class="cursor-pointer">
                                        <input type="radio" name="appointmentTime" value="${time}" class="sr-only peer" required>
                                        <div class="py-2 px-4 border rounded-lg text-center peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition">
                                            ${time}
                                        </div>
                                    </label>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Reason for Visit</label>
                            <textarea id="visitReason" rows="3"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                                placeholder="Describe your symptoms or reason for consultation..."></textarea>
                        </div>

                        <div class="flex gap-4 pt-4">
                            <button type="button" onclick="closeBookingModal()" 
                                class="flex-1 py-3 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 transition">
                                Cancel
                            </button>
                            <button type="submit" id="bookBtn"
                                class="flex-1 bg-primary text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                                Confirm Booking
                            </button>
                        </div>
                    </div>
                </form>
            `;

            modal.classList.remove('hidden');
        }

        function closeBookingModal() {
            document.getElementById('bookingModal').classList.add('hidden');
            selectedDoctor = null;
        }

        function getTomorrowDate() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            return tomorrow.toISOString().split('T')[0];
        }

        async function submitBooking(e) {
            e.preventDefault();
            
            const date = document.getElementById('appointmentDate').value;
            const time = document.querySelector('input[name="appointmentTime"]:checked')?.value;
            const reason = document.getElementById('visitReason').value;

            if (!date || !time) {
                showToast('Please select date and time', 'error');
                return;
            }

            const btn = document.getElementById('bookBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Booking...';

            try {
                const token = localStorage.getItem('token');
                const prediction = JSON.parse(localStorage.getItem('bookingPrediction') || 'null');
                
                const response = await fetch(`${API_URL}/api/patient/book`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        doctor_id: selectedDoctor.doctor_id,
                        appointment_date: date,
                        appointment_time: time + ':00',
                        reason: reason,
                        prediction_id: prediction?.prediction_id || null
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Booking failed');
                }

                localStorage.removeItem('bookingPrediction');
                closeBookingModal();
                showToast('Appointment booked successfully!', 'success');
                
                setTimeout(() => {
                    window.location.href = 'history.html';
                }, 1500);
            } catch (error) {
                console.error('Error:', error);
                showToast(error.message || 'Booking failed', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Confirm Booking';
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }
    </script>
</body>
</html>
